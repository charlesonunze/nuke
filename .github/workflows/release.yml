name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Verify Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$HOMEBREW_TAP_TOKEN"

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Homebrew formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          commit_date="$(git show -s --format=%cI "$release_commit")"
          source_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --output "$RUNNER_TEMP/nuke-source.tar.gz" \
            "$source_url"

          source_sha256="$(sha256sum "$RUNNER_TEMP/nuke-source.tar.gz" | cut -d ' ' -f 1)"
          packaging/homebrew/render-formula.sh \
            "$version" \
            "$source_sha256" \
            "$release_commit" \
            "$commit_date" \
            "$RUNNER_TEMP/nuke.rb"
          ruby -c "$RUNNER_TEMP/nuke.rb"

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: charlesonunze/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Publish Homebrew formula
        run: |
          mkdir -p homebrew-tap/Formula
          cp "$RUNNER_TEMP/nuke.rb" homebrew-tap/Formula/nuke.rb

          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/nuke.rb

          if git -C homebrew-tap diff --cached --quiet; then
            echo "Homebrew formula is already current"
            exit 0
          fi

          git -C homebrew-tap commit -m "nuke ${GITHUB_REF_NAME}"
          git -C homebrew-tap push origin HEAD:main
